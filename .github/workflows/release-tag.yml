name: release-tag

# main에 올라온 버전(devlog_trade/__init__.py의 __version__)으로 vX.Y.Z 태그를 단다.
# 같은 태그가 이미 있으면 아무것도 하지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 버전 태그 달기
        run: |
          version=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('devlog_trade/__init__.py').read_text()).group(1))")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag 이미 있음"; exit 0
          fi
          grep -q "## \[$version\]\|## $version" CHANGELOG.md || { echo "CHANGELOG.md에 $version 항목이 없어요"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "trade-bot $tag"
          git push origin "$tag"

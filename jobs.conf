# 줄마다 `python -m devlog_trade coin` 옵션 하나. # 뒤는 메모예요.
# 맥(launchd)·Docker·작업 스케줄러가 이 파일을 차례로 돌려요. 처음엔 --dry-run으로 화면만 보고, 괜찮으면 지워요.
--exchange binance --market spot --interval 1h --dry-run
--exchange upbit --market spot --interval 1h --dry-run
--exchange binance --market futures --leverage 3 --interval 1h --dry-run

# 모의 4주 비교(이슈 #18): 같은 시세로 세 겹 거름망 기법을 따로 돌려 위 지금 규칙 계좌와 나란히 봐요. 상태 파일은 trade-state-ladder-*.json
--rule ladder --exchange binance --market spot --dry-run
--rule ladder --exchange upbit --market spot --dry-run
--rule ladder --exchange binance --market futures --dry-run
